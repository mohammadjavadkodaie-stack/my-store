services:
  postgres:
    image: postgres:17-alpine
    container_name: store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - store-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d store']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  store-postgres-data:
